<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro de Motorista - Flip</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0a0c10 0%, #14181f 100%);
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(255,193,7,0.08) 0%, rgba(0,0,0,0) 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Modern Header */
        header {
            background: rgba(10, 12, 16, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 193, 7, 0.2);
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF 30%, #FFC107 70%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .logo span {
            background: linear-gradient(135deg, #FFC107 30%, #FFA000 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 900;
        }

        nav ul {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 12px;
        }

        nav ul li a {
            color: #e0e0e0;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            transition: all 0.25s ease;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(4px);
        }

        nav ul li a:hover {
            background: #FFC107;
            color: #0a0c10;
            box-shadow: 0 0 12px rgba(255,193,7,0.5);
            transform: scale(1.02);
        }

        /* Container */
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        /* Glassmorphic Form Card */
        .form-card {
            background: rgba(20, 24, 31, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 40px 32px;
            box-shadow: 0 30px 45px -12px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,193,7,0.15);
            border: 1px solid rgba(255,193,7,0.25);
            transition: transform 0.3s ease;
        }

        .form-card:hover {
            transform: translateY(-3px);
        }

        .form-card h2 {
            text-align: center;
            margin-bottom: 28px;
            background: linear-gradient(135deg, #FFC107, #FFA000);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
            font-size: 28px;
        }

        /* Step Indicator Modern */
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            gap: 12px;
        }

        .step {
            text-align: center;
            flex: 1;
            padding: 12px 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 60px;
            transition: all 0.3s;
            color: #aaa;
            font-size: 13px;
            font-weight: 500;
        }

        .step.active {
            background: linear-gradient(105deg, #FFC107, #FFA000);
            color: #0a0c10;
            box-shadow: 0 4px 12px rgba(255,193,7,0.3);
        }

        .step-number {
            display: inline-block;
            width: 28px;
            height: 28px;
            line-height: 28px;
            border-radius: 30px;
            background: rgba(255,255,255,0.2);
            margin-right: 8px;
            font-weight: bold;
            font-size: 13px;
        }

        .step.active .step-number {
            background: rgba(0,0,0,0.2);
            color: #0a0c10;
        }

        /* Progress Bar */
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-bottom: 32px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #FFC107, #FFA000);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 10px;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #FFC107;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(10, 12, 16, 0.7);
            border: 1.5px solid rgba(255,193,7,0.3);
            border-radius: 60px;
            font-size: 16px;
            color: #fff;
            transition: all 0.25s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #FFC107;
            box-shadow: 0 0 0 3px rgba(255,193,7,0.2);
            background: #0a0c10;
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        small {
            display: block;
            margin-top: 6px;
            color: #aaa;
            font-size: 12px;
        }

        /* Checkbox */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }

        .checkbox-group input {
            width: 20px;
            height: 20px;
            accent-color: #FFC107;
            margin: 0;
        }

        .checkbox-group label {
            margin: 0;
            color: #ccc;
            font-weight: normal;
            font-size: 14px;
        }

        .checkbox-group a {
            color: #FFC107;
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        /* Button */
        .btn {
            background: linear-gradient(105deg, #FFC107 0%, #FFA000 100%);
            color: #0a0c10;
            border: none;
            padding: 16px 28px;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            margin-top: 10px;
            box-shadow: 0 8px 20px -6px rgba(255,193,7,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:hover {
            background: linear-gradient(105deg, #FFD54F 0%, #FFB300 100%);
            box-shadow: 0 12px 28px -6px rgba(255,193,7,0.5);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Notification */
        .notification {
            background: linear-gradient(105deg, #4CAF50, #2e7d32);
            color: white;
            padding: 16px 20px;
            border-radius: 60px;
            margin-bottom: 24px;
            text-align: center;
            display: none;
            font-weight: 600;
            backdrop-filter: blur(8px);
            animation: slideIn 0.3s ease;
        }

        .notification.error {
            background: linear-gradient(105deg, #f44336, #c62828);
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Login Link */
        .login-link {
            text-align: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,193,7,0.2);
        }

        .login-link a {
            color: #FFC107;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }

        .login-link a:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0,0,0,0.2);
            border-top: 2px solid #0a0c10;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .form-card {
                padding: 28px 20px;
            }
            .step {
                font-size: 11px;
                padding: 8px 4px;
            }
            .step-number {
                width: 24px;
                height: 24px;
                line-height: 24px;
                font-size: 11px;
                margin-right: 4px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Fl<span>ip</span></div>
        <nav>
            <ul>
                <li><a href="motorista.html">Área do Motorista</a></li>
            </ul>
        </nav>
    </header>
    
    <div class="container">
        <div id="notification" class="notification"></div>
        
        <div class="form-card">
            <h2>🚗 Registro de Motorista</h2>
            
            <div class="step-indicator">
                <div class="step active">
                    <span class="step-number">1</span>
                    <span>Dados Pessoais</span>
                </div>
                <div class="step">
                    <span class="step-number">2</span>
                    <span>Verificação</span>
                </div>
                <div class="step">
                    <span class="step-number">3</span>
                    <span>Concluído</span>
                </div>
            </div>
            
            <div class="progress-bar">
                <div class="progress" id="registrationProgress"></div>
            </div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="regName">📝 Nome Completo *</label>
                    <input type="text" id="regName" placeholder="Digite seu nome completo" required>
                </div>
                
                <div class="form-group">
                    <label for="regUsername">👤 Usuário *</label>
                    <input type="text" id="regUsername" placeholder="Escolha um nome de usuário" required>
                    <small>Apenas letras e números, mínimo 3 caracteres</small>
                </div>
                
                <div class="form-group">
                    <label for="regLicensePlate">🚙 Matrícula do Carro *</label>
                    <input type="text" id="regLicensePlate" placeholder="Ex: AA-00-00" required>
                </div>
                
                <div class="form-group">
                    <label for="regNif">📄 NIF *</label>
                    <input type="text" id="regNif" placeholder="Digite seu NIF" required>
                </div>
                
                <div class="form-group">
                    <label for="regPhone">📞 Telefone</label>
                    <input type="tel" id="regPhone" placeholder="+351 912 345 678">
                </div>
                
                <div class="form-group">
                    <label for="regPassword">🔒 Senha *</label>
                    <input type="password" id="regPassword" placeholder="Crie uma senha" required>
                    <small>Mínimo 6 caracteres</small>
                </div>
                
                <div class="form-group">
                    <label for="regConfirmPassword">🔐 Confirmar Senha *</label>
                    <input type="password" id="regConfirmPassword" placeholder="Confirme sua senha" required>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="termsAgreement" required>
                    <label for="termsAgreement">Li e concordo com os <a href="#">Termos de Serviço</a> e <a href="#">Política de Privacidade</a></label>
                </div>
                
                <button type="button" id="registerButton" class="btn">
                    <span id="registerButtonText">Registrar</span>
                    <span id="registerButtonLoading" style="display: none;"><span class="spinner"></span> Processando...</span>
                </button>
            </form>
            
            <div class="login-link">
                <a href="motorista.html">← Voltar para o Login</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script>
        // Configuração do Firebase (NOVA CONFIGURAÇÃO - lisboago-app)
        const firebaseConfig = {
            apiKey: "AIzaSyB2ljIwjmbPF1vfCgth4bLd3d7hhLdxKIk",
            authDomain: "lisboago-app.firebaseapp.com",
            databaseURL: "https://lisboago-app-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lisboago-app",
            storageBucket: "lisboago-app.firebasestorage.app",
            messagingSenderId: "467502556237",
            appId: "1:467502556237:web:ff0074a42a664f7efba804"
        };
        
        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // Chave para armazenamento local (backup/cache)
        const DRIVERS_STORAGE_KEY = 'flip_drivers';
        
        // Estado do registro
        let registrationStep = 1;
        
        // Inicializar armazenamento local
        function initializeDriversStorage() {
            if (!localStorage.getItem(DRIVERS_STORAGE_KEY)) {
                localStorage.setItem(DRIVERS_STORAGE_KEY, JSON.stringify({}));
            }
        }

        // Obter motoristas do armazenamento local
        function getAllDriversLocal() {
            const drivers = localStorage.getItem(DRIVERS_STORAGE_KEY);
            return drivers ? JSON.parse(drivers) : {};
        }

        // Salvar motorista localmente (cache)
        function saveDriverLocal(driverData) {
            const drivers = getAllDriversLocal();
            drivers[driverData.driverId] = driverData;
            localStorage.setItem(DRIVERS_STORAGE_KEY, JSON.stringify(drivers));
            return true;
        }

        // Verificar se usuário já existe LOCALMENTE (apenas cache)
        function userExistsLocal(username) {
            const drivers = getAllDriversLocal();
            for (const driverId in drivers) {
                if (drivers[driverId].username === username) {
                    return true;
                }
            }
            return false;
        }

        // VERIFICAÇÃO CRÍTICA: Verificar se usuário já existe no FIREBASE (sistema global)
        async function userExistsFirebase(username) {
            try {
                const snapshot = await database.ref('drivers_registered').orderByChild('username').equalTo(username).once('value');
                return snapshot.exists();
            } catch (error) {
                console.error('Erro ao verificar usuário no Firebase:', error);
                throw error;
            }
        }

        // Verificar se matrícula já existe no Firebase
        async function licensePlateExistsFirebase(licensePlate) {
            try {
                const snapshot = await database.ref('drivers_registered').orderByChild('licensePlate').equalTo(licensePlate).once('value');
                return snapshot.exists();
            } catch (error) {
                console.error('Erro ao verificar matrícula no Firebase:', error);
                throw error;
            }
        }

        // Verificar se NIF já existe no Firebase
        async function nifExistsFirebase(nif) {
            try {
                const snapshot = await database.ref('drivers_registered').orderByChild('nif').equalTo(nif).once('value');
                return snapshot.exists();
            } catch (error) {
                console.error('Erro ao verificar NIF no Firebase:', error);
                throw error;
            }
        }
        
        // Mostrar notificação
        function showNotification(message, isError = false) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = isError ? 'notification error' : 'notification';
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 5000);
        }

        // Atualizar progresso
        function updateProgress(step) {
            const progressBar = document.getElementById('registrationProgress');
            const steps = document.querySelectorAll('.step');
            
            // Atualizar indicador de passos
            steps.forEach((s, index) => {
                if (index + 1 === step) {
                    s.classList.add('active');
                } else {
                    s.classList.remove('active');
                }
            });
            
            // Atualizar barra de progresso
            const percentage = (step / 3) * 100;
            progressBar.style.width = percentage + '%';
            
            registrationStep = step;
        }

        // Validar formulário
        function validateForm() {
            const name = document.getElementById('regName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const licensePlate = document.getElementById('regLicensePlate').value.trim();
            const nif = document.getElementById('regNif').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const termsAgreed = document.getElementById('termsAgreement').checked;
            
            // Validações básicas
            if (!name || !username || !licensePlate || !nif || !password || !confirmPassword) {
                showNotification("Todos os campos obrigatórios (*) devem ser preenchidos!", true);
                return false;
            }
            
            if (password !== confirmPassword) {
                showNotification("As senhas não coincidem!", true);
                return false;
            }
            
            if (password.length < 6) {
                showNotification("A senha deve ter pelo menos 6 caracteres!", true);
                return false;
            }
            
            if (username.length < 3) {
                showNotification("O usuário deve ter pelo menos 3 caracteres!", true);
                return false;
            }
            
            if (!/^[a-zA-Z0-9]+$/.test(username)) {
                showNotification("O usuário deve conter apenas letras e números!", true);
                return false;
            }
            
            if (!termsAgreed) {
                showNotification("Você deve aceitar os Termos de Serviço!", true);
                return false;
            }
            
            return true;
        }

        // REGISTRO DE MOTORISTA (FOCO NO FIREBASE - SISTEMA GLOBAL)
        document.getElementById('registerButton').addEventListener('click', async function() {
            const registerButton = document.getElementById('registerButton');
            const buttonText = document.getElementById('registerButtonText');
            const buttonLoading = document.getElementById('registerButtonLoading');
            
            // Validar formulário
            if (!validateForm()) {
                return;
            }
            
            // Obter valores
            const name = document.getElementById('regName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const licensePlate = document.getElementById('regLicensePlate').value.trim();
            const nif = document.getElementById('regNif').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            
            // Atualizar UI para mostrar processamento
            buttonText.style.display = 'none';
            buttonLoading.style.display = 'flex';
            registerButton.disabled = true;
            updateProgress(2);
            
            try {
                // PASSO 1: Verificar duplicatas no Firebase (sistema global)
                showNotification("🔍 Verificando disponibilidade no sistema...", false);
                
                const [userExists, licenseExists, nifExists] = await Promise.all([
                    userExistsFirebase(username),
                    licensePlateExistsFirebase(licensePlate),
                    nifExistsFirebase(nif)
                ]);
                
                if (userExists) {
                    throw new Error("Este nome de usuário já está registrado no sistema!");
                }
                
                if (licenseExists) {
                    throw new Error("Esta matrícula já está registrada no sistema!");
                }
                
                if (nifExists) {
                    throw new Error("Este NIF já está registrado no sistema!");
                }
                
                // PASSO 2: Criar motorista
                updateProgress(3);
                showNotification("📝 Criando sua conta no sistema global...", false);
                
                // Criar ID único para o motorista
                const driverId = 'driver_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                
                // Dados completos para salvar localmente (com senha)
                const driverDataLocal = {
                    name: name,
                    username: username,
                    licensePlate: licensePlate,
                    nif: nif,
                    phone: phone || '',
                    password: password,
                    driverId: driverId,
                    createdAt: new Date().toISOString(),
                    status: 'offline',
                    registrationDate: new Date().toISOString(),
                    lastLogin: null
                };
                
                // Dados para salvar no Firebase (SEM SENHA por segurança)
                const driverDataFirebase = {
                    name: name,
                    username: username,
                    licensePlate: licensePlate,
                    nif: nif,
                    phone: phone || '',
                    driverId: driverId,
                    createdAt: new Date().toISOString(),
                    status: 'offline',
                    registrationDate: new Date().toISOString(),
                    deviceInfo: navigator.userAgent,
                    ipAddress: 'desconhecido',
                    updatedAt: null
                };
                
                // PASSO 3: Salvar no Firebase (sistema global)
                await database.ref(`drivers_registered/${driverId}`).set(driverDataFirebase);
                
                // PASSO 4: Salvar cache localmente (com senha para login futuro)
                saveDriverLocal(driverDataLocal);
                
                // PASSO 5: Enviar notificação para o admin
                await database.ref('admin_notifications').push({
                    type: 'new_driver_registration',
                    driverName: name,
                    driverUsername: username,
                    licensePlate: licensePlate,
                    nif: nif,
                    driverId: driverId,
                    registrationDate: new Date().toISOString(),
                    deviceInfo: navigator.userAgent,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                
                // PASSO 6: Sucesso - atualizar UI
                showNotification("✅ Registro realizado com sucesso no sistema global!", false);
                
                // Limpar formulário
                document.getElementById('registerForm').reset();
                
                // Mostrar mensagem final
                setTimeout(() => {
                    showNotification("🎉 Parabéns! Sua conta foi criada. Redirecionando para login...", false);
                    
                    // Redirecionar para login após 3 segundos (AGORA PARA motorista.html)
                    setTimeout(() => {
                        window.location.href = 'motorista.html';
                    }, 3000);
                }, 1000);
                
            } catch (error) {
                console.error('Erro no registro:', error);
                
                // Voltar para passo 1 em caso de erro
                updateProgress(1);
                
                // Restaurar botão
                buttonText.style.display = 'inline';
                buttonLoading.style.display = 'none';
                registerButton.disabled = false;
                
                // Mostrar erro específico
                if (error.message.includes('usuário já está registrado')) {
                    showNotification(error.message, true);
                    document.getElementById('regUsername').focus();
                } else if (error.message.includes('matrícula já está registrada')) {
                    showNotification(error.message, true);
                    document.getElementById('regLicensePlate').focus();
                } else if (error.message.includes('NIF já está registrado')) {
                    showNotification(error.message, true);
                    document.getElementById('regNif').focus();
                } else if (error.message.includes('Failed to fetch') || error.message.includes('Network')) {
                    showNotification("❌ Erro de conexão! Verifique sua internet e tente novamente.", true);
                } else {
                    showNotification("❌ Erro ao registrar: " + error.message, true);
                }
            }
        });

        // Permitir registro com Enter
        document.getElementById('regConfirmPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('registerButton').click();
            }
        });

        // Validar usuário em tempo real
        document.getElementById('regUsername').addEventListener('blur', async function() {
            const username = this.value.trim();
            
            if (username.length < 3) return;
            
            try {
                const exists = await userExistsFirebase(username);
                if (exists) {
                    showNotification("⚠️ Este usuário já está registrado no sistema!", true);
                    this.style.borderColor = '#f44336';
                } else {
                    this.style.borderColor = '#4CAF50';
                }
            } catch (error) {
                // Silenciar erro de rede durante validação em tempo real
                console.log('Validação em tempo real não disponível (offline)');
            }
        });

        // Validar senha em tempo real
        document.getElementById('regConfirmPassword').addEventListener('input', function() {
            const password = document.getElementById('regPassword').value;
            const confirmPassword = this.value;
            
            if (confirmPassword && password !== confirmPassword) {
                this.style.borderColor = '#f44336';
                document.getElementById('regPassword').style.borderColor = '#f44336';
            } else if (confirmPassword) {
                this.style.borderColor = '#4CAF50';
                document.getElementById('regPassword').style.borderColor = '#4CAF50';
            }
        });

        // Inicializar quando a página carregar
        window.addEventListener('load', function() {
            initializeDriversStorage();
            updateProgress(1);
        });
    </script>
</body>
</html>
